name: Weekly Auto-Format

on:
  schedule:
    - cron: '0 9 * * 1'  # Every Monday at 9am UTC
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  format:
    name: Auto Format
    runs-on: ubuntu-latest
    steps:
      - name: Checkout dev
        uses: actions/checkout@v7
        with:
          ref: dev
          fetch-depth: 0

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.41.2'
          channel: 'stable'
          cache: true

      - name: Get Flutter dependencies
        run: flutter pub get

      - name: Run formatter
        run: dart format .

      - name: Check for changes
        id: changes
        run: |
          if git diff --quiet; then
            echo "changed=false" >> $GITHUB_OUTPUT
            echo "No formatting changes needed."
          else
            echo "changed=true" >> $GITHUB_OUTPUT
            echo "Formatting changes detected:"
            git diff --stat
          fi

      # dev is protected (PRs + status checks only), so open a PR instead of
      # pushing to it directly.
      - name: Open formatting PR
        if: steps.changes.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          branch="chore/auto-format"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout -B "$branch"
          git add -u
          git commit -m "Chore - Auto-format Dart files"
          git push --force origin "$branch"
          if [ -z "$(gh pr list --head "$branch" --state open --json number --jq '.[].number')" ]; then
            gh pr create --base dev --head "$branch" \
              --title "Chore - Auto-format Dart files" \
              --body "Weekly \`dart format\` run. PRs opened by GitHub Actions don't trigger CI on their own; close and reopen this PR to run the required checks."
          fi
